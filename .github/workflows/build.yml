name: Build

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: Package and upload the compiled binary.
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset: macos-aarch64
          - runner: ubuntu-latest
            asset: linux-x86_64
          - runner: windows-latest
            asset: windows-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Build
        run: lute run build

      - name: Smoketest
        run: build/hop --help

      - name: Package binary
        if: inputs.upload-artifacts && runner.os != 'Windows'
        run: zip -j hop-${{ matrix.asset }}.zip build/hop

      - name: Package Windows binary
        if: inputs.upload-artifacts && runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/hop.exe -DestinationPath hop-${{ matrix.asset }}.zip

      - name: Upload artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.asset }}
          path: hop-${{ matrix.asset }}.zip
